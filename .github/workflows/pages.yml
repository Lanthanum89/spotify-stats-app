name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      # Names the service worker's cache after this commit, so every deploy
      # gets a fresh, self-contained shell cache (see BUILD_ID in sw.js).
      # Fails the deploy if the placeholder is missing rather than shipping
      # a worker that can never update.
      - name: Stamp service worker build ID
        run: |
          sed -i "s/^const BUILD_ID = 'dev'/const BUILD_ID = '${GITHUB_SHA::12}'/" public/sw.js
          grep -q "^const BUILD_ID = '${GITHUB_SHA::12}'" public/sw.js

      - name: Upload public/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
